services:
  - type: web
    name: roberto-equitazione
    runtime: node
    plan: free
    repo: https://github.com/DominiqueOthniel/roberto-equitazione
    branch: main
    buildCommand: npm install --production=false && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: PORT
        value: 1000
    healthCheckPath: /
    autoDeployTrigger: commit
